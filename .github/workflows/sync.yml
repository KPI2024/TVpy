name: Sync upstream (add-only)
on:
  schedule:
    - cron: '0 */1 * * *'   # 每1小时自动同步一次
  workflow_dispatch:        # 也可在 Actions 页面手动触发

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add upstream
        run: |
          git remote add upstream https://github.com/jwarrenrzflynn/TVpy.git || true
          git fetch upstream main || echo "FETCH_FAILED, keep existing"
          git config user.name "sync-bot"
          git config user.email "sync@example.com"

      - name: Merge (add-only, keep deletions)
        run: |
          # 冲突时保留本地版本（-X ours），非冲突的新增/修改正常合并
          git merge upstream/main --no-commit --no-ff -X ours || git checkout --ours -- . || true
          # 关键：把 upstream 删掉的文件全部恢复回来（只增不删）
          git diff --name-status --diff-filter=D HEAD -- . | awk '{print $2}' | while read f; do
            [ -n "$f" ] && git checkout HEAD -- "$f" 2>/dev/null || true
          done
          git commit -m "sync: merge upstream (add-only)" || echo "nothing to commit"

      - name: Push
        run: git push origin HEAD
